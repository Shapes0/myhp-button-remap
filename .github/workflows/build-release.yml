name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore app dependencies
      run: dotnet restore HPButtonRemap/HPButtonRemap.csproj

    - name: Build app (Release)
      run: dotnet build HPButtonRemap/HPButtonRemap.csproj --configuration Release --no-restore

    - name: Publish app (framework-dependent single file)
      run: dotnet publish HPButtonRemap/HPButtonRemap.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output ./publish/app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HPButtonRemap-lightweight-${{ github.run_number }}
        path: ./publish/app/HPButtonRemap.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/app/HPButtonRemap.exe
        body: |
          # HP Button Remap ${{ github.ref_name }}

          ## Requirements

          - Windows 10/11
          - .NET 8 Desktop Runtime

          ## Installation

          1. Download `HPButtonRemap.exe`
          2. Run it once (it self-installs to `%LOCALAPPDATA%\HPButtonRemap`)

          ## Uninstallation

          Use tray menu -> `Uninstall...`
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
