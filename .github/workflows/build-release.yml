name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore app dependencies
      run: dotnet restore HPButtonRemap/HPButtonRemap.csproj

    - name: Build app (Release)
      run: dotnet build HPButtonRemap/HPButtonRemap.csproj --configuration Release --no-restore

    - name: Publish app (framework-dependent single file)
      run: dotnet publish HPButtonRemap/HPButtonRemap.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output ./publish/app

    - name: Create lightweight release zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./publish/package -Force | Out-Null
        Copy-Item ./publish/app/HPButtonRemap.exe ./publish/package/HPButtonRemap.exe -Force
        Copy-Item ./config.json ./publish/package/config.json -Force
        Copy-Item ./Install.ps1 ./publish/package/Install.ps1 -Force
        Copy-Item ./Uninstall.ps1 ./publish/package/Uninstall.ps1 -Force
        Copy-Item ./README.md ./publish/package/README.md -Force
        Compress-Archive -Path ./publish/package/* -DestinationPath ./publish/HPButtonRemap-${{ github.ref_name }}-lightweight.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HPButtonRemap-lightweight-${{ github.ref_name }}
        path: ./publish/HPButtonRemap-${{ github.ref_name }}-lightweight.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/HPButtonRemap-${{ github.ref_name }}-lightweight.zip
        body: |
          # HP Button Remap ${{ github.ref_name }}

          ## Requirements

          - Windows 10/11
          - .NET 8 Desktop Runtime

          ## Installation

          1. Download and unzip `HPButtonRemap-<version>-lightweight.zip`
          2. Run `Install.ps1`

          ## Uninstallation

          Run `Uninstall.ps1` (or `%LOCALAPPDATA%\HPButtonRemap\Uninstall.ps1`)
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
